<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resumaker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // One-time cache purge (v2) - clears stale service workers from broken deployments
      if ('serviceWorker' in navigator) {
        var purgeKey = 'sw_purge_v2';
        if (!localStorage.getItem(purgeKey)) {
          caches.keys().then(function(names) {
            names.forEach(function(name) { caches.delete(name); });
          });
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            regs.forEach(function(reg) { reg.unregister(); });
          });
          localStorage.setItem(purgeKey, '1');
          setTimeout(function() { location.reload(); }, 500);
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
